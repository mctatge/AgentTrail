name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check publication policy
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check-publication.py
      - name: Test recording data and query contracts
        run: swift test
      - name: Package the app
        run: bash scripts/build-app.sh
      - name: Smoke-test packaged CLI and MCP
        run: python3 scripts/smoke-test.py
